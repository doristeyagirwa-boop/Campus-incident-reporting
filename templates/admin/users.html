{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-people"></i> Manage Users</h2>

<div class="card shadow">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Joined</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.id }}</td>
                    <td>{{ user.full_name }}</td>
                    <td>{{ user.email }}</td>
                    <td>
                        <span class="badge bg-{{ 'primary' if user.role == 'admin' else 'secondary' }}">
                            {{ user.role }}
                        </span>
                    </td>
                    <td>{{ user.created_at }}</td>
                </tr>
                {% else %}
                <tr><td colspan="5" class="text-center text-muted py-3">No users found.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
