{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-bar-chart-line"></i> Admin Reports</h2>

<!-- Summary Cards -->
<div class="row mb-4">
    <div class="col-md-4">
        <div class="card text-white bg-primary">
            <div class="card-body text-center">
                <h5 class="card-title">Total Incidents</h5>
                <h1>{{ total }}</h1>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-success">
            <div class="card-body text-center">
                <h5 class="card-title">Resolved</h5>
                <h1>{{ resolved }}</h1>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-danger">
            <div class="card-body text-center">
                <h5 class="card-title">Unresolved</h5>
                <h1>{{ unresolved }}</h1>
            </div>
        </div>
    </div>
</div>

<!-- Charts Row 1 -->
<div class="row mb-4">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <i class="bi bi-pie-chart"></i> Incidents by Category
            </div>
            <div class="card-body">
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <i class="bi bi-graph-up"></i> Incidents by Month
            </div>
            <div class="card-body">
                <canvas id="monthChart"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- Charts Row 2 -->
<div class="row mb-4">
    <div class="col-md-6 mx-auto">
        <div class="card shadow">
            <div class="card-header bg-warning text-white">
                <i class="bi bi-check-circle"></i> Resolution Rate
            </div>
            <div class="card-body">
                <canvas id="resolutionChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
const reportData = {
    categoryLabels: {{ by_category | map(attribute='name') | list | tojson }},
    categoryData: {{ by_category | map(attribute='total') | list | tojson }},
    monthLabels: {{ by_month | map(attribute='month') | list | tojson }},
    monthData: {{ by_month | map(attribute='total') | list | tojson }},
    resolved: {{ resolved }},
    unresolved: {{ unresolved }}
};
</script>

<script src="{{ url_for('static', filename='js/reports.js') }}"></script>
{% endblock %}
