{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-gear"></i> Settings</h2>

<div class="row">
    <div class="col-md-7 mb-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <i class="bi bi-tags"></i> Incident Categories
            </div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Description</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for category in categories %}
                        <tr>
                            <td>{{ category.name }}</td>
                            <td>{{ category.description or '—' }}</td>
                            <td class="text-end">
                                <form method="POST" action="{{ url_for('admin_delete_category', category_id=category.id) }}" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this category?');">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        {% else %}
                        <tr><td colspan="3" class="text-center text-muted py-3">No categories yet.</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="col-md-5 mb-4">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <i class="bi bi-plus-circle"></i> Add Category
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('admin_add_category') }}">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Add Category</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
