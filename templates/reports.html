{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-bar-chart"></i> Incident Reports</h2>

<!-- Summary Cards -->
<div class="row mb-4">
    <div class="col-md-4">
        <div class="card text-white bg-primary">
            <div class="card-body text-center">
                <h5 class="card-title">Total Incidents</h5>
                <h1>{{ total }}</h1>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-success">
            <div class="card-body text-center">
                <h5 class="card-title">Resolved</h5>
                <h1>{{ resolved }}</h1>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-danger">
            <div class="card-body text-center">
                <h5 class="card-title">Unresolved</h5>
                <h1>{{ unresolved }}</h1>
            </div>
        </div>
    </div>
</div>

<!-- Charts Row 1 -->
<div class="row mb-4">
    <!-- Incidents by Category -->
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <i class="bi bi-pie-chart"></i> Incidents by Category
            </div>
            <div class="card-body">
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Incidents by Month -->
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <i class="bi bi-graph-up"></i> Incidents by Month
            </div>
            <div class="card-body">
                <canvas id="monthChart"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- Charts Row 2 -->
<div class="row mb-4">
    <!-- Resolution Rate -->
    <div class="col-md-6 mx-auto">
        <div class="card shadow">
            <div class="card-header bg-warning text-white">
                <i class="bi bi-check-circle"></i> Resolution Rate
            </div>
            <div class="card-body">
                <canvas id="resolutionChart"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- Chart.js Scripts -->
<script>
    // 1. Incidents by Category (Pie Chart)
    const categoryCtx = document.getElementById('categoryChart').getContext('2d');
    new Chart(categoryCtx, {
        type: 'pie',
        data: {
            labels: [{% for item in by_category %}'{{ item.name }}',{% endfor %}],
            datasets: [{
                data: [{% for item in by_category %}{{ item.total }},{% endfor %}],
                backgroundColor: ['#0d6efd', '#198754', '#dc3545', '#ffc107', '#0dcaf0']
            }]
        }
    });

    // 2. Incidents by Month (Line Chart)
    const monthCtx = document.getElementById('monthChart').getContext('2d');
    new Chart(monthCtx, {
        type: 'line',
        data: {
            labels: [{% for item in by_month %}'{{ item.month }}',{% endfor %}],
            datasets: [{
                label: 'Incidents',
                data: [{% for item in by_month %}{{ item.total }},{% endfor %}],
                borderColor: '#198754',
                backgroundColor: 'rgba(25, 135, 84, 0.2)',
                fill: true,
                tension: 0.4
            }]
        }
    });

    // 3. Resolution Rate (Doughnut Chart)
    const resolutionCtx = document.getElementById('resolutionChart').getContext('2d');
    new Chart(resolutionCtx, {
        type: 'doughnut',
        data: {
            labels: ['Resolved', 'Unresolved'],
            datasets: [{
                data: [{{ resolved }}, {{ unresolved }}],
                backgroundColor: ['#198754', '#dc3545']
            }]
        }
    });
</script>
{% endblock %}
